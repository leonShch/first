name: Research Experiment

on:
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run experiment
        run: |
          python experiments/EXP-001/run.py

      - name: Show result
        run: |
          cat experiments/EXP-001/result.json
